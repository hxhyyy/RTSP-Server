[versions]
libraryGroup = "com.github.pedroSG94"
versionCode = "136"
versionName = "1.3.6"

#plugins versions
agp = "8.6.1"
kotlin = "2.1.20"
dokka = "2.0.0"

#dependencies versions
#noinspection GradleDependency, version 1.7.0 need min sdk 21
appcompat = "1.6.1"
#noinspection GradleDependency, version 2.2.0 need min sdk 21
constraintlayout = "2.1.4"
coroutines = "1.10.2"
ktor = "2.3.13"
# 🐾 Use forked RootEncoder with UDP port reuse fix (based on 2.6.1)
rootEncoder = "5814ad541"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
# 🐾 Use forked RootEncoder with UDP port reuse fix
rootEncoder-library = { module = "com.github.hxhyyy.RootEncoder:library", version.ref = "rootEncoder" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
maven-publish = { id = "maven-publish", version.ref = "agp" }
jetbrains-kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }